spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    # The database pooler allows only a small number of connections on the free plan.
    # Can be overridden by environment variables, e.g. SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE.
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false

server:
  port: ${PORT:8080}

# API docs page (OpenApiConfig). Under /api so the Vercel proxy serves it too.
springdoc:
  # Answers are JSON unless an endpoint says otherwise (ping is text, the export is CSV).
  default-produces-media-type: application/json
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs
    # The access token pasted into Authorize is kept only for the open tab.
    persist-authorization: false
    try-it-out-enabled: true
    display-request-duration: true

app:
  # Public address of the frontend, used to build links in emails.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:true}
  # Without both values the app runs but sends no email (see MailConfig).
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: Fifty30
  # Push notifications (NotificationConfig). Without both keys the app runs and offers none.
  # Make a pair with: java backend/src/main/java/com/financetracker/notification/VapidKeyGenerator.java
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    # Who push services contact if this server misbehaves (RFC 8292): a mailto: or the site's URL.
    vapid-subject: ${VAPID_SUBJECT:${app.base-url}}
  # Reminder timer (ReminderJobs). Off only in tests, which pick the time themselves.
  reminders:
    scheduled: true
  # Error monitoring (SentryConfig). Without a DSN nothing is sent.
  sentry:
    dsn: ${SENTRY_DSN:}
    environment: ${SENTRY_ENVIRONMENT:production}
  # Attempts allowed per window: login per 15 minutes, register per hour. See AuthRateLimits.
  rate-limit:
    login-per-ip: 20
    login-per-email: 10
    register-per-ip: 5
    register-global: 50
    # Per hour; each request can send an email.
    password-reset-per-ip: 10
    password-reset-per-email: 3
